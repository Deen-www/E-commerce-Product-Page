<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>E-commerce Website</title>
  
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>

<body> 
  
  <!==== MenuIcon ====>
     <img src="icons/icon-menu.svg" class="menuIcon">
  
  <div class ="menu">
     <h1>sneakers</h1>
     
     <div>
       <img src="icons/icon-cart.svg" class="cart">
       <img src="images/image-avatar.png" width = 30px>
     </div>
  </div>

  <!==== This is where cart items will be display ====>
  <div class ="cartItem">

    <h2 class ="headingTwo">Cart</h2>
    <hr>
    <div class ="empty"></div>

  </div>
  
  <!==== Header ====>
  <header>
    
    <nav class="navbar">
      
      <div class="heading">
        <h1>sneakers</h1>
        
        <div class="anchor">
          <a id="#">Collection</a>
          <a id="#">Men</a>
          <a id="#">Women</a>
          <a id="#">About</a>
          <a id="#">Contact</a>
        </div>
        
      </div>
      
      <div class="heros-image">
        <img src="icons/icon-cart.svg">
        <img src="images/image-avatar.png">
      </div>
      
    </nav>
    
  </header>
  <!==== Heading ends here ====>
  
  <!==== Sidebar ====>
  <aside class="sidebar" id= "sidebar">
    <img src="icons/icon-close.svg" class="closeMenu">
    
    <div class="info">
     <a id="#">Collections</a>
     <a id="#">Men</a>
     <a id="#">Women</a>
     <a id="#">About</a>
     <a id="#">Contact</a>
     </div>
  </aside>
  
  
  <!====MAIN-CONTENT====>
  <!--main-container will only contain two section-->
  
  <main class="container">
    
    <!====First section====>
    <section class="first-section">
      
      <div></div>
      <div></div>
      
    </section>
    <!====First-section ends here====>
    
    <!====Second-section====>
    <section class="second-section">
      <!--first div-->
      <div>
        
        <p></p>
        <h2></h2>
        <p></p>
        
      </div>
      <!--second div-->
      <div>
        
        <h3></h3>
        <p></p>
        
        <div>
          <button></button>
        </div>
        
      </div>
      
      <!--third div--->
      <div>
        
        <!--first div-->
        <div></div>
        <!--second div-->
        <div></div>
        
      </div>
      
    </section>
    <!====second section ends here===>
    
  </main>
  

  
  <script src="script.js"></script>
</body>

</html>
